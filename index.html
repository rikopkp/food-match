<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Shoku↔match</title>

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    body {

      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",

        "Yu Gothic", sans-serif;

      background: #f7f7f7;

      color: #222;

    }

    button, input, select {

      font: inherit;

    }

    button {

      cursor: pointer;

      border: none;

    }

    .app {

      width: 100%;

      max-width: 430px;

      min-height: 100vh;

      margin: 0 auto;

      background: white;

      position: relative;

      padding-bottom: 85px;

    }

    .screen {

      display: none;

      min-height: calc(100vh - 85px);

    }

    .screen.active {

      display: block;

    }

    /* HEADER */

    .header {

      padding: 18px 20px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      border-bottom: 1px solid #eee;

      background: white;

    }

    .logo {

      font-size: 22px;

      font-weight: 800;

      color: #ff5c73;

    }

    .logo span {

      color: #222;

    }

    .header-small {

      font-size: 13px;

      color: #888;

    }

    /* HOME */

    .hero {

      padding: 55px 24px 35px;

      background: linear-gradient(145deg, #fff0f3, #fff);

    }

    .hero-badge {

      display: inline-block;

      background: #ffe0e6;

      color: #ff4f69;

      padding: 7px 12px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: 700;

      margin-bottom: 16px;

    }

    .hero h1 {

      font-size: 34px;

      line-height: 1.35;

      margin-bottom: 14px;

    }

    .pink {

      color: #ff5c73;

    }

    .hero p {

      color: #666;

      line-height: 1.7;

      font-size: 15px;

      margin-bottom: 25px;

    }

    .main-btn {

      width: 100%;

      background: #ff5c73;

      color: white;

      padding: 17px;

      border-radius: 14px;

      font-weight: 700;

      font-size: 16px;

      box-shadow: 0 6px 20px rgba(255,92,115,.25);

    }

    .secondary-btn {

      width: 100%;

      background: white;

      color: #ff5c73;

      border: 1px solid #ff5c73;

      padding: 15px;

      border-radius: 14px;

      font-weight: 700;

      margin-top: 10px;

    }

    .section {

      padding: 28px 20px;

    }

    .section-title {

      font-size: 20px;

      margin-bottom: 18px;

    }

    .features {

      display: grid;

      gap: 12px;

    }

    .feature {

      background: #fafafa;

      padding: 17px;

      border-radius: 15px;

    }

    .feature-icon {

      font-size: 27px;

      margin-bottom: 8px;

    }

    .feature h3 {

      font-size: 15px;

      margin-bottom: 5px;

    }

    .feature p {

      font-size: 13px;

      color: #777;

      line-height: 1.6;

    }

    /* DIAGNOSIS */

    .diagnosis {

      padding: 25px 20px;

    }

    .progress-text {

      color: #ff5c73;

      font-size: 13px;

      font-weight: 700;

    }

    .progress {

      width: 100%;

      height: 7px;

      background: #eee;

      border-radius: 10px;

      margin: 10px 0 35px;

      overflow: hidden;

    }

    .progress-bar {

      height: 100%;

      background: #ff5c73;

      width: 8%;

      transition: .3s;

    }

    .question {

      font-size: 23px;

      line-height: 1.5;

      margin-bottom: 30px;

    }

    .answers {

      display: grid;

      gap: 12px;

    }

    .answer {

      background: white;

      border: 1px solid #ddd;

      padding: 17px;

      border-radius: 14px;

      text-align: left;

      transition: .2s;

    }

    .answer:hover {

      border-color: #ff5c73;

      background: #fff6f7;

    }

    /* RESULT */

    .result {

      text-align: center;

      padding: 45px 20px;

    }

    .result-label {

      color: #999;

      font-size: 13px;

    }

    .animal {

      font-size: 80px;

      margin: 20px 0;

    }

    .result h2 {

      font-size: 28px;

      margin-bottom: 12px;

    }

    .result-desc {

      color: #666;

      line-height: 1.8;

      margin-bottom: 25px;

    }

    .tags {

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 8px;

      margin-bottom: 30px;

    }

    .tag {

      background: #fff0f3;

      color: #ff5c73;

      padding: 8px 12px;

      border-radius: 20px;

      font-size: 12px;

    }

    /* JOBS */

    .jobs-header {

      padding: 25px 20px 10px;

    }

    .jobs-header h2 {

      font-size: 24px;

    }

    .jobs-header p {

      color: #888;

      margin-top: 6px;

      font-size: 13px;

    }

    .filters {

      display: flex;

      gap: 8px;

      padding: 12px 20px;

      overflow-x: auto;

    }

    .filter {

      white-space: nowrap;

      border: 1px solid #ddd;

      background: white;

      padding: 9px 13px;

      border-radius: 20px;

      font-size: 12px;

    }

    .job-list {

      padding: 10px 16px 30px;

      display: grid;

      gap: 18px;

    }

    .job-card {

      border: 1px solid #eee;

      border-radius: 18px;

      overflow: hidden;

      background: white;

      box-shadow: 0 5px 20px rgba(0,0,0,.05);

    }

    .job-image {

      height: 170px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 65px;

      background: #fff1e8;

    }

    .job-content {

      padding: 16px;

    }

    .match {

      color: #ff5c73;

      font-weight: 800;

      font-size: 13px;

      margin-bottom: 6px;

    }

    .job-title {

      font-size: 19px;

      font-weight: 800;

      margin-bottom: 5px;

    }

    .job-info {

      color: #777;

      font-size: 13px;

      line-height: 1.8;

    }

    .job-actions {

      display: flex;

      gap: 8px;

      margin-top: 14px;

    }

    .detail-btn {

      flex: 1;

      padding: 12px;

      border-radius: 10px;

      background: #f2f2f2;

    }

    .like-btn {

      flex: 1;

      padding: 12px;

      border-radius: 10px;

      background: #ff5c73;

      color: white;

      font-weight: 700;

    }

    .like-btn.liked {

      background: #222;

    }

    /* DETAIL */

    .detail {

      padding: 20px;

    }

    .back {

      background: none;

      font-size: 14px;

      margin-bottom: 20px;

    }

    .detail-image {

      height: 220px;

      border-radius: 20px;

      background: #fff1e8;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 90px;

      margin-bottom: 22px;

    }

    .detail h2 {

      font-size: 25px;

      margin-bottom: 8px;

    }

    .detail-info {

      margin-top: 20px;

      background: #fafafa;

      border-radius: 15px;

      padding: 17px;

      line-height: 2;

      font-size: 14px;

    }

    /* PROFILE */

    .profile {

      padding: 30px 20px;

    }

    .profile-top {

      text-align: center;

      margin-bottom: 30px;

    }

    .avatar {

      width: 85px;

      height: 85px;

      background: #ffe3e8;

      border-radius: 50%;

      margin: 0 auto 12px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 40px;

    }

    .profile-card {

      background: #fafafa;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 15px;

    }

    .profile-card h3 {

      margin-bottom: 12px;

    }

    .profile-row {

      display: flex;

      justify-content: space-between;

      border-bottom: 1px solid #eee;

      padding: 10px 0;

      font-size: 14px;

    }

    .profile-row:last-child {

      border: none;

    }

    /* NAV */

    .nav {

      position: fixed;

      bottom: 0;

      width: 100%;

      max-width: 430px;

      height: 72px;

      background: white;

      border-top: 1px solid #eee;

      display: flex;

      justify-content: space-around;

      z-index: 10;

    }

    .nav button {

      background: none;

      width: 25%;

      font-size: 11px;

      color: #777;

    }

    .nav-icon {

      display: block;

      font-size: 22px;

      margin-bottom: 3px;

    }

    /* MODAL */

    .modal-bg {

      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0,0,0,.45);

      z-index: 20;

      align-items: flex-end;

      justify-content: center;

    }

    .modal-bg.show {

      display: flex;

    }

    .modal {

      width: 100%;

      max-width: 430px;

      background: white;

      border-radius: 25px 25px 0 0;

      padding: 28px 20px 35px;

    }

    .modal h3 {

      font-size: 22px;

      margin-bottom: 10px;

    }

    .modal p {

      color: #777;

      line-height: 1.7;

      margin-bottom: 20px;

    }

    .close-btn {

      width: 100%;

      padding: 14px;

      background: #eee;

      border-radius: 12px;

      margin-top: 10px;

    }

  </style>

</head>

<body>

<div class="app">

  <!-- HOME -->

  <section id="home" class="screen active">

    <div class="header">

      <div class="logo">Shoku<span>↔</span>match</div>

      <div class="header-small">飲食専門求人</div>

    </div>

    <div class="hero">

      <div class="hero-badge">

        飲食業界専門マッチング

      </div>

      <h1>

        バイト探しを、<br>

        <span class="pink">もっと相性で。</span>

      </h1>

      <p>

        時給や場所だけじゃなく、

      </button>

        求人を見てみる

      </button>

    </div>

    <div class="section">

      <h2 class="section-title">

        Shoku↔matchなら

      </h2>

      <div class="features">

        <div class="feature">

          <div class="feature-icon
