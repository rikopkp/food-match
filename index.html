<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shoku↔match</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;

  background: #fff7fa;

  color: #302a30;

}

header {

  background: white;

  padding: 18px 20px;

  border-bottom: 1px solid #eee;

  position: sticky;

  top: 0;

  z-index: 10;

}

.logo {

  font-size: 24px;

  font-weight: 900;

}

.logo .pink {

  color: #ff4f8b;

}

.logo .purple {

  color: #6961ff;

}

.hero {

  text-align: center;

  padding: 45px 20px 30px;

  background: linear-gradient(135deg, #ffe1ed, #e8e5ff);

}

.hero h1 {

  font-size: 38px;

  line-height: 1.15;

  margin: 15px 0;

}

.hero h1 span {

  color: #ff4f8b;

}

.hero p {

  color: #6f6870;

  line-height: 1.7;

}

main {

  max-width: 520px;

  margin: auto;

  padding: 20px;

}

.title {

  font-size: 20px;

  font-weight: 900;

  margin-bottom: 15px;

}

.card {

  background: white;

  border-radius: 28px;

  overflow: hidden;

  box-shadow: 0 12px 35px rgba(0,0,0,.1);

}

.card-top {

  padding: 28px;

  background: linear-gradient(135deg, #fff0f6, #f0efff);

}

.emoji {

  width: 75px;

  height: 75px;

  background: white;

  border-radius: 22px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 40px;

  margin-bottom: 18px;

}

.card h2 {

  margin: 0 0 8px;

}

.station {

  color: #777;

  font-size: 13px;

}

.type {

  display: inline-block;

  margin-top: 12px;

  background: #6961ff;

  color: white;

  padding: 6px 12px;

  border-radius: 20px;

  font-size: 12px;

  font-weight: bold;

}

.card-body {

  padding: 25px;

}

.salary {

  color: #ff4f8b;

  font-size: 28px;

  font-weight: 900;

}

.tags {

  display: flex;

  flex-wrap: wrap;

  gap: 7px;

  margin: 18px 0;

}

.tag {

  background: #f0efff;

  color: #625bdf;

  padding: 7px 10px;

  border-radius: 9px;

  font-size: 11px;

  font-weight: bold;

}

.tag.green {

  background: #eafaf3;

  color: #299b6d;

}

.info {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

}

.info div {

  background: #faf8fa;

  padding: 13px;

  border-radius: 13px;

}

.info small {

  display: block;

  color: #999;

  font-size: 10px;

  margin-bottom: 5px;

}

.info strong {

  font-size: 12px;

}

.mbti {

  margin-top: 20px;

  padding: 17px;

  border-radius: 18px;

  background: linear-gradient(135deg,#f0efff,#fff0f6);

}

.mbti small {

  color: #777;

}

.mbti strong {

  display: block;

  color: #6961ff;

  font-size: 20px;

  margin-top: 5px;

}

.buttons {

  display: flex;

  justify-content: center;

  gap: 18px;

  margin: 25px 0;

}

button {

  border: none;

  cursor: pointer;

}

.action {

  width: 65px;

  height: 65px;

  border-radius: 50%;

  background: white;

  box-shadow: 0 8px 20px rgba(0,0,0,.12);

  font-size: 25px;

}

.like {

  width: 75px;

  height: 75px;

  background: #ff4f8b;

  color: white;

}

nav {

  position: fixed;

  bottom: 0;

  left: 0;

  right: 0;

  height: 70px;

  background: white;

  border-top: 1px solid #eee;

  display: flex;

  justify-content: center;

  gap: 35px;

  align-items: center;

}

nav button {

  background: none;

  color: #777;

  font-size: 11px;

}

nav button:first-child {

  color: #ff4f8b;

}

body {

  padding-bottom: 80px;

}

</style>

</head>

<body>

<header>

  <div class="logo">

    <span class="pink">Shoku</span><span class="purple">↔match</span>

  </div>

</header>

<section class="hero">

  <div>🍽 飲食バイト・求人マッチング</div>

  <h1>

    働く場所も、<br>

    <span>相性</span>で選ぶ。

  </h1>

  <p>

    条件だけじゃ分からない。<br>

    お店の雰囲気とあなたの性格までマッチング。

  </p>

</section>

<main>

<div class="title">

  あなたに合いそうなお店

</div>

<div class="card">

  <div class="card-top">

    <div class="emoji">🥩</div>

    <h2>炭火焼肉 こはる</h2>

    <div class="station">

      📍 池袋駅 徒歩3分

    </div>

    <div class="type">

      焼肉

    </div>

  </div>

  <div class="card-body">

    <div class="salary">

      ¥1,600〜

    </div>

    <div class="tags">

      <span class="tag green">髪色自由</span>

      <span class="tag green">ネイルOK</span>

      <span class="tag green">ピアスOK</span>

      <span class="tag">まかない</span>

      <span class="tag">交通費支給</span>

    </div>

    <div class="info">

      <div>

        <small>勤務時間</small>

        <strong>17:00〜23:30</strong>

      </div>

      <div>

        <small>週何日</small>

        <strong>週2〜OK</strong>

      </div>

      <div>

        <small>服装</small>

        <strong>黒Tシャツ＋エプロン</strong>

      </div>

      <div>

        <small>年齢層</small>

        <strong>20代中心</strong>

      </div>

      <div>

        <small>雰囲気</small>

        <strong>ワイワイ</strong>

      </div>

      <div>

        <small>男女比</small>

        <strong>4：6</strong>

      </div>

      <div>

        <small>通勤</small>

        <strong>自転車OK</strong>

      </div>

      <div>

        <small>シフト提出</small>

        <strong>2週間ごと</strong>

      </div>

    </div>

    <div class="mbti">

      <small>🧠 MBTI MATCH</small>

      <strong>

        ENFP / ESFP と相性◎

      </strong>

    </div>

  </div>

</div>

<div class="buttons">

  <button class="action">

    ✕

  </button>

  <button class="action">

    ★

  </button>

  <button class="action like" onclick="match()">

    ♥

  </button>

</div>

</main>

<nav>

  <button>🔎<br>求人</button>

  <button>✨<br>スカウト</button>

  <button>💕<br>MATCH</button>

  <button>🌷<br>プロフィール</button>

</nav>

<script>

function match() {

  alert("💕 MATCHしました！");

}

</script>

</body>

</html>
