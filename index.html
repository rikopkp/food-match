<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shoku↔match</title>

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    body {

      font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Helvetica Neue",

        "Hiragino Kaku Gothic ProN",

        "Yu Gothic",

        sans-serif;

      background: #fff8fb;

      color: #29252b;

      min-height: 100vh;

    }

    button {

      font-family: inherit;

      cursor: pointer;

    }

    /* =========================

       HEADER

    ========================= */

    header {

      height: 72px;

      background: rgba(255,255,255,0.95);

      border-bottom: 1px solid #f0e5eb;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 6%;

      position: sticky;

      top: 0;

      z-index: 50;

      backdrop-filter: blur(12px);

    }

    .logo {

      font-size: 25px;

      font-weight: 900;

      letter-spacing: -1px;

    }

    .logo span:first-child {

      color: #ff5b91;

    }

    .logo span:last-child {

      color: #6c63ff;

    }

    .header-badge {

      background: #fff0f6;

      color: #ff4f89;

      padding: 7px 12px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 800;

    }

    /* =========================

       HERO

    ========================= */

    .hero {

      padding: 55px 20px 35px;

      text-align: center;

      background:

        radial-gradient(circle at 15% 20%, #ffd9e8 0, transparent 28%),

        radial-gradient(circle at 85% 20%, #dcd9ff 0, transparent 28%),

        #fff8fb;

    }

    .hero-small {

      display: inline-block;

      background: white;

      color: #ff568d;

      border: 1px solid #ffd1e2;

      border-radius: 999px;

      padding: 7px 15px;

      font-size: 12px;

      font-weight: 800;

      margin-bottom: 18px;

    }

    .hero h1 {

      font-size: clamp(34px, 7vw, 62px);

      line-height: 1.05;

      font-weight: 900;

      letter-spacing: -2px;

      margin-bottom: 18px;

    }

    .hero h1 .pink {

      color: #ff518b;

    }

    .hero h1 .purple {

      color: #6d63ff;

    }

    .hero p {

      color: #777078;

      font-size: 15px;

      line-height: 1.8;

    }

    /* =========================

       MAIN

    ========================= */

    main {

      max-width: 1100px;

      margin: auto;

      padding: 10px 20px 120px;

    }

    .section-title {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin: 25px 0 15px;

    }

    .section-title h2 {

      font-size: 21px;

      font-weight: 900;

    }

    .section-title span {

      font-size: 12px;

      color: #999;

    }

    /* =========================

       FILTER

    ========================= */

    .filters {

      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding: 5px 0 15px;

      scrollbar-width: none;

    }

    .filters::-webkit-scrollbar {

      display: none;

    }

    .filter {

      flex: 0 0 auto;

      border: 1px solid #eadfe5;

      background: white;

      color: #625b61;

      padding: 9px 15px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 700;

    }

    .filter.active {

      background: #ff5a91;

      color: white;

      border-color: #ff5a91;

    }

    /* =========================

       JOB CARD

    ========================= */

    .card-area {

      max-width: 520px;

      margin: 0 auto;

      position: relative;

    }

    .job-card {

      background: white;

      border-radius: 28px;

      overflow: hidden;

      box-shadow: 0 15px 45px rgba(67, 35, 52, 0.12);

      border: 1px solid #f1e6eb;

      animation: cardIn 0.35s ease;

    }

    @keyframes cardIn {

      from {

        opacity: 0;

        transform: translateY(15px) scale(.98);

      }

      to {

        opacity: 1;

        transform: translateY(0) scale(1);

      }

    }

    .job-top {

      padding: 28px;

      background:

        linear-gradient(135deg, #ffedf4, #f1efff);

      position: relative;

    }

    .job-emoji {

      width: 75px;

      height: 75px;

      border-radius: 22px;

      background: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 40px;

      box-shadow: 0 8px 20px rgba(0,0,0,.08);

      margin-bottom: 18px;

    }

    .job-top h3 {

      font-size: 25px;

      margin-bottom: 7px;

    }

    .station {

      color: #706970;

      font-size: 13px;

    }

    .job-type {

      display: inline-block;

      margin-top: 13px;

      background: #6d63ff;

      color: white;

      padding: 6px 11px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 800;

    }

    .like-match {

      position: absolute;

      right: 20px;

      top: 20px;

      background: white;

      padding: 10px 12px;

      border-radius: 15px;

      text-align: center;

      box-shadow: 0 7px 20px rgba(0,0,0,.08);

    }

    .like-match strong {

      display: block;

      font-size: 20px;

      color: #ff4f89;

    }

    .like-match small {

      font-size: 9px;

      color: #888;

    }

    .job-body {

      padding: 24px;

    }

    .salary {

      font-size: 29px;

      font-weight: 900;

      color: #ff4f89;

      margin-bottom: 16px;

    }

    .salary small {

      font-size: 12px;

      color: #777;

      font-weight: 600;

    }

    .tags {

      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 22px;

    }

    .tag {

      background: #f7f5ff;

      color: #665ee8;

      padding: 7px 10px;

      border-radius: 9px;

      font-size: 11px;

      font-weight: 800;

    }

    .tag.green {

      background: #edfbf5;

      color: #31a878;

    }

    .info-grid {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-bottom: 20px;

    }

    .info-box {

      background: #faf8fa;

      padding: 13px;

      border-radius: 14px;

    }

    .info-box small {

      display: block;

      color: #9b9399;

      font-size: 10px;

      margin-bottom: 5px;

    }

    .info-box strong {

      font-size: 12px;

    }

    .sub-title {

      font-size: 13px;

      font-weight: 900;

      margin: 20px 0 10px;

    }

    .task-list {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

    }

    .task {

      border: 1px solid #eee7eb;

      padding: 7px 9px;

      border-radius: 8px;

      font-size: 10px;

      color: #686067;

    }

    /* =========================

       MBTI

    ========================= */

    .mbti-box {

      background: linear-gradient(135deg, #f1efff, #fff0f6);

      border-radius: 18px;

      padding: 16px;

      margin-top: 20px;

    }

    .mbti-title {

      font-size: 11px;

      color: #756d76;

      font-weight: 800;

      margin-bottom: 5px;

    }

    .mbti-result {

      display: flex;

      align-items: center;

      justify-content: space-between;

    }

    .mbti-result strong {

      font-size: 21px;

      color: #6d63ff;

    }

    .mbti-result span {

      background: white;

      padding: 7px 10px;

      border-radius: 999px;

      font-size: 10px;

      font-weight: 800;

      color: #ff508a;

    }

    /* =========================

       SWIPE BUTTONS

    ========================= */

    .swipe-buttons {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 18px;

      margin: 25px 0 10px;

    }

    .swipe-btn {

      border: none;

      width: 62px;

      height: 62px;

      border-radius: 50%;

      background: white;

      box-shadow: 0 8px 25px rgba(0,0,0,.12);

      font-size: 25px;

      transition: .2s;

    }

    .swipe-btn:hover {

      transform: scale(1.08);

    }

    .pass {

      color: #ff6374;

    }

    .like {

      width: 74px;

      height: 74px;

      background: #ff5790;

      color: white;

      font-size: 30px;

    }

    .super {

      color: #6d63ff;

    }

    /* =========================

       NAV

    ========================= */

    .bottom-nav {

      position: fixed;

      bottom: 0;

      left: 0;

      right: 0;

      height: 75px;

      background: rgba(255,255,255,.96);

      backdrop-filter: blur(15px);

      border-top: 1px solid #eee4e9;

      display: flex;

      justify-content: center;

      z-index: 100;

    }

    .nav-inner {

      width: 100%;

      max-width: 600px;

      display: grid;

      grid-template-columns: repeat(4, 1fr);

    }

    .nav-btn {

      border: none;

      background: transparent;

      color: #9b9299;

      font-size: 10px;

      font-weight: 700;

    }

    .nav-btn div {

      font-size: 21px;

      margin-bottom: 3px;

    }

    .nav-btn.active {

      color: #ff518b;

    }

    /* =========================

       OTHER SCREENS

    ========================= */

    .screen {

      display: none;

    }

    .screen.active {

      display: block;

    }

    .profile-card,

    .match-card,

    .scout-card {

      background: white;

      border: 1px solid #f0e5eb;

      border-radius: 24px;

      padding: 25px;

      box-shadow: 0 10px 35px rgba(67,35,52,.08);

      margin-bottom: 15px;

    }

    .profile-head {

      display: flex;

      align-items: center;

      gap: 15px;

      margin-bottom: 20px;

    }

    .avatar {

      width: 70px;

      height: 70px;

      border-radius: 22px;

      background: linear-gradient(135deg,#ffd7e7,#ddd9ff);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 35px;

    }

    .profile-head h3 {

      font-size: 20px;

      margin-b
